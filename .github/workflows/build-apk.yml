name: Build APK

on:
  workflow_dispatch:          # زر "Run workflow" من تبويب Actions

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        run: pip install flet==0.28.3

      # مفتاح توقيع ثابت: هو الشرط لأن أندرويد يقبل التحديث فوق النسخة المنصّبة بدون مسح البيانات.
      # (يُكتب خارج مجلد التطبيق حتى لا ينحط داخل الـAPK). لا تغيّر هذا المفتاح أبداً بعد أول تنصيب.
      - name: Write signing key
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/masarif-release.jks"
        env:
          KEYSTORE_B64: 

      # رقم البناء يزيد تلقائياً مع كل تشغيل (أندرويد يرفض نسخة برقم أقل).
      - name: Build APK
        run: >
          flet build apk -v
          --build-number ${{ github.run_number }}
          --android-signing-key-store "$RUNNER_TEMP/masarif-release.jks"
          --android-signing-key-store-password fac15b69a362c897f997
          --android-signing-key-password fac15b69a362c897f997
          --android-signing-key-alias masarif

      - uses: actions/upload-artifact@v4
        with:
          name: masarif-apk
          path: build/apk/*.apk
